<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>My RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="boss-bar">
    <div id="boss-name">Boss</div>
    <div class="bar boss-hp">
      <div id="boss-fill" class="bar-fill"></div>
      <span id="boss-text">0 / 0</span>
    </div>
  </div>

  <div id="hud">
    <div id="hud-panel">
      <div id="hud-level">LEVEL 1</div>
      <div class="bar hp-bar">
        <div id="hp-fill" class="bar-fill"></div>
        <span id="hp-text">HP 100 / 100</span>
      </div>
      <div class="bar exp-bar">
        <div id="exp-fill" class="bar-fill"></div>
        <span id="exp-text">EXP 0 / 100</span>
      </div>
      <div id="hud-hint">Move: WASD / Bag: E</div>
      <div id="hud-bag">Bag 0</div>
    </div>
  </div>

  <div id="touch-ui">
    <div id="joystick-pad">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
  </div>

  <button id="bag-button" type="button">Bag 0</button>

  <div id="inventory-panel">
    <div id="inventory-title">Inventory (E)</div>
    <div id="inventory-help">Drag to equip. Fuse 5 of the same weapon. Fail returns 2.</div>
    <div id="inventory-list"></div>
  </div>

  <div id="slot-bar">
    <button class="slot-button" data-slot="0" type="button">
      <span class="slot-cool"></span>
      <span class="slot-name">Empty</span>
      <span class="slot-meta"></span>
    </button>
    <button class="slot-button" data-slot="1" type="button">
      <span class="slot-cool"></span>
      <span class="slot-name">Empty</span>
      <span class="slot-meta"></span>
    </button>
    <button class="slot-button" data-slot="2" type="button">
      <span class="slot-cool"></span>
      <span class="slot-name">Empty</span>
      <span class="slot-meta"></span>
    </button>
    <button class="slot-button" data-slot="3" type="button">
      <span class="slot-cool"></span>
      <span class="slot-name">Empty</span>
      <span class="slot-meta"></span>
    </button>
    <button class="slot-button" data-slot="4" type="button">
      <span class="slot-cool"></span>
      <span class="slot-name">Empty</span>
      <span class="slot-meta"></span>
    </button>
  </div>

  <div id="game-over">
    <div class="game-over-title">YOU DIED</div>
    <div class="game-over-hint">Respawning in 3</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
